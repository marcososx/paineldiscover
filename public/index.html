<!DOCTYPE html>
<html lang="pt-BR" data-alert="normalidade">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brusque Discover — Painel de Crise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <!-- ── HEADER ───────────────────────────────────────────── -->
  <header>
    <div class="brand">
      <img class="logo" src="/img/logo.png" alt="Brusque Discover">
      <div class="bt">Brusque Discover<small>Painel de Crise</small></div>
    </div>
    <div class="hd-center">
      <div class="badge alert" id="alerta"><span class="dot"></span><span id="alerta-txt">—</span></div>
    </div>
    <div class="hd-right">
      <div class="badge" id="cobertura">
        <span class="dot"></span><span id="cobertura-txt">—</span>
        <a id="cobertura-link" class="badge-link" target="_blank" rel="noopener" title="Abrir live" style="display:none"></a>
      </div>
    </div>
  </header>

  <!-- ── TICKER / CRAWL (últimas notícias Brusque Discover) ── -->
  <div class="ticker">
    <div class="tk-viewport"><div class="tk-track" id="ticker-track"></div></div>
  </div>

  <!-- ── MAPA ─────────────────────────────────────────────── -->
  <main>
    <section class="map">
      <iframe id="mapa" src="https://brusque-maps.marcososx.workers.dev" title="Mapa de Crise Brusque" allow="geolocation"></iframe>
    </section>

    <!-- ── TEMPO REAL · feed OSINT (estilo pizzint.watch) — canto sup. direito, recolhível ── -->
    <section class="osint" id="osint">
      <div class="osint-head" id="osint-head" title="Recolher / expandir">
        <span class="oh-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 15 9"/><path d="M12 6a6 6 0 0 1 6 6"/><path d="M12 2a10 10 0 0 1 10 10"/><rect x="3" y="15" width="6" height="6" rx="1.2"/></svg></span>
        <h2>Tempo real</h2>
        <span class="live">ao vivo</span>
        <span class="oh-z" id="osint-clock">--:--</span>
        <span class="oh-auto">AUTO</span>
        <button class="osint-toggle" id="osint-toggle" title="Recolher / expandir">▾</button>
      </div>
      <div class="osint-sub">
        <span class="oh-mon">Monitorando · QG Discover</span>
        <span class="count" id="osint-count"></span>
      </div>
      <div class="osint-viewport"><div class="osint-track" id="osint-track"></div></div>
      <div class="osint-mini"><div class="mini-track" id="osint-mini-track"></div></div>
    </section>

    <div class="statusbar" id="statusbar">brusquediscover.com.br · minuto a minuto</div>
  </main>

<script src="/js/store.js?v=4"></script>
<script src="/js/dashboard.js?v=4"></script>
</body>
</html>
