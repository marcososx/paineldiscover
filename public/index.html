<!DOCTYPE html>
<html lang="pt-BR" data-alert="normalidade">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brusque Discover — Painel de Crise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <!-- ── HEADER ───────────────────────────────────────────── -->
  <header>
    <div class="brand">
      <img class="logo" src="/img/logo.png" alt="Brusque Discover">
      <div class="bt">Brusque Discover<small>Painel de Crise</small></div>
    </div>
    <div class="hd-right">
      <div class="badge" id="cobertura"><span class="dot"></span><span id="cobertura-txt">—</span></div>
      <div class="badge alert" id="alerta"><span class="dot"></span><span id="alerta-txt">—</span></div>
    </div>
  </header>

  <!-- ── TICKER / CRAWL (últimas notícias Brusque Discover) ── -->
  <div class="ticker">
    <div class="tk-label"><span class="pulse"></span> Notícias</div>
    <div class="tk-viewport"><div class="tk-track" id="ticker-track"></div></div>
  </div>

  <!-- ── MAPA ─────────────────────────────────────────────── -->
  <main>
    <section class="map">
      <div class="map-tag">Mapa de Crise</div>
      <iframe id="mapa" src="https://brusque-maps.marcososx.workers.dev" title="Mapa de Crise Brusque"></iframe>
    </section>

    <!-- ── OSINT FEED (horizontal, sobreposto ao mapa) ────── -->
    <section class="osint">
      <div class="osint-head">
        <h2>OSINT Feed</h2>
        <span class="live">ao vivo</span>
        <span class="count" id="osint-count"></span>
      </div>
      <div class="osint-viewport"><div class="osint-track" id="osint-track"></div></div>
    </section>

    <div class="statusbar" id="statusbar">brusquediscover.com.br · minuto a minuto</div>
  </main>

<script src="/js/store.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
